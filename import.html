<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>一括インポート(おもいでバインダー)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.3rem; }
  input[type="password"] { font-size: 1rem; padding: 8px 10px; width: 240px; }
  button { font-size: 1rem; padding: 10px 18px; margin-left: 8px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #log { margin-top: 20px; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; background: #f4f4f0; padding: 12px; border-radius: 6px; max-height: 400px; overflow-y: auto; }
  .summary { margin-top: 10px; color: #555; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>一括インポート用ページ(一回きり)</h1>
<p>合言葉を入力して「インポート開始」を押すと、下記のデータをその合言葉の保管庫にまとめて追加します。使い終わったらこのページ(import.html)は削除して問題ありません。</p>
<div>
  <input type="password" id="passInput" placeholder="合言葉" autocomplete="off" />
  <button id="startBtn">インポート開始</button>
</div>
<div class="summary" id="summary"></div>
<div id="log"></div>

<script>
var SUPABASE_URL = "https://kkukkhhocuuihytwwuoc.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_JZafbvGqkIKl9swIWxEBIA_8lbAfbpU";
var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 名前のみのリスト(1〜30、見出しなし・詳細なし)
var LIST_NAMES_ONLY = [
  "ヤンヤン", "キムドッキ", "小西", "レオ", "ゲノム", "チュッチュ", "いわたく", "ふるてつ",
  "じぇーちゃん", "うっけん", "まちゃ", "こうや", "おぐけん", "きょうへい", "けいじゅ", "きくりん",
  "みっくーも", "つーくん", "門井", "しゅうへい", "まさひろ", "七海", "あやか", "さほ",
  "ぴーちゃん", "柴田", "まさひろ", "あゆむ", "おくの", "山本貴一"
].map(function (name) { return { name: name, facts: [] }; });

// 見出しなしグループA
var LIST_GROUP_A = [
  { name: "梶原優星", facts: ["放火魔", "野村証券", "杉原の上司"] },
  { name: "杉原豪", facts: ["肌カサカサで、穴空いてる", "スポンジボブ", "梶原の手下", "サッカー部"] },
  { name: "杉崎", facts: ["野球部", "コロッケ", "松井裕樹か杉崎の二択で、法政にこうは杉崎選ぶ", "結果怪我で大失敗"] },
  { name: "菊池豪", facts: ["学級委員長", "バスケ部", "頼り甲斐ある"] },
  { name: "さねかた", facts: ["野球よくくる", "ツッコミの天才", "梶原の親友"] }
];

// 見出しなしグループB
var LIST_GROUP_B = [
  { name: "ケービー", facts: ["下手くそキーパー", "すぐ骨折る", "成長期1年で42センチ伸びる"] },
  { name: "金井響", facts: ["黒い", "妹もっと黒い、wiiのキャラクターの黒人にそっくり", "ドッチボールで投げる時スローインで投げてくる"] },
  { name: "とかじ", facts: ["キーパー", "不登校", "おじいちゃんと同居", "粉雪ずっと歌ってる"] },
  { name: "わちあさか", facts: ["性転換"] },
  { name: "ひらわたりほこ", facts: ["はるちゃんの付き人"] }
];

function makeEpisodes(facts) {
  var now = Date.now();
  return facts.map(function (text, i) {
    return { id: cryptoId(), text: text, createdAt: new Date(now + i).toISOString() };
  });
}

function cryptoId() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
}

async function sha256Hex(text) {
  var enc = new TextEncoder().encode(text);
  var buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, "0"); }).join("");
}

var logEl = document.getElementById("log");
function log(msg) {
  logEl.textContent += msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

document.getElementById("startBtn").addEventListener("click", async function () {
  var pass = document.getElementById("passInput").value.trim();
  if (!pass) { alert("合言葉を入れてください"); return; }
  var btn = this;
  btn.disabled = true;
  logEl.textContent = "";

  var roomId = await sha256Hex(pass);
  log("保管庫ID: " + roomId.slice(0, 12) + "…");

  try {
    var signIn = await supabaseClient.auth.signInAnonymously();
    if (signIn.error) throw signIn.error;
    log("接続OK");
  } catch (e) {
    log("接続に失敗しました: " + (e && e.message ? e.message : e));
    btn.disabled = false;
    return;
  }

  var allBatches = [
    { list: LIST_NAMES_ONLY, tag: null },
    { list: LIST_GROUP_A, tag: null },
    { list: LIST_GROUP_B, tag: null }
  ];

  var okCount = 0, ngCount = 0;
  for (var b = 0; b < allBatches.length; b++) {
    var batch = allBatches[b];
    for (var i = 0; i < batch.list.length; i++) {
      var person = batch.list[i];
      try {
        var res = await supabaseClient.from("people").insert({
          room_id: roomId,
          name: person.name,
          nickname: "",
          tags: batch.tag ? [batch.tag] : [],
          hobbies: [],
          photo_urls: [],
          episodes: makeEpisodes(person.facts),
          history: []
        });
        if (res.error) throw res.error;
        okCount++;
        log("追加: " + person.name);
      } catch (e) {
        ngCount++;
        log("失敗: " + person.name + " (" + (e && e.message ? e.message : e) + ")");
      }
    }
  }

  document.getElementById("summary").textContent = "完了: 成功 " + okCount + "件 / 失敗 " + ngCount + "件";
  btn.disabled = false;
});
</script>
</body>
</html>
